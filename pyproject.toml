[project]
name = "peil-mcp"
version = "0.1.2"
description = "MCP server for Peil — log hours, draft invoices and check where you stand from an AI assistant"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Peil", email = "studio@jeroenkortekaas.com" }]
keywords = ["mcp", "peil", "invoicing", "zzp", "freelance", "claude", "ai"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial",
]
dependencies = [
    "mcp>=1.2",
    "httpx>=0.27",
]

[project.urls]
# Documentation points at the EN page on purpose: this package's audience finds
# it through the MCP registries, and they read English. The NL page is at
# /docs/mcp and the two are hreflang-paired.
Homepage = "https://peil.app"
Documentation = "https://peil.app/en/docs/mcp"
Source = "https://github.com/Luminc/peil-mcp"
Issues = "https://github.com/Luminc/peil-mcp/issues"

[project.scripts]
peil-mcp = "peil_mcp.server:main"

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "respx>=0.21",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/peil_mcp"]

[tool.pytest.ini_options]
# Make tests independent of the editable-install mechanism (src layout).
pythonpath = ["src"]
