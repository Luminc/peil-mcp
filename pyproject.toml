[project]
name = "peil-mcp"
version = "0.1.0"
description = "MCP server for Peil — log hours, draft invoices and check where you stand from an AI assistant"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.2",
    "httpx>=0.27",
]

[project.scripts]
peil-mcp = "peil_mcp.server:main"

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "respx>=0.21",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/peil_mcp"]

[tool.pytest.ini_options]
# Make tests independent of the editable-install mechanism (src layout).
pythonpath = ["src"]
